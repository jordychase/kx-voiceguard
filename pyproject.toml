[project]
name = "kx-voiceguard"
version = "0.1.0"
description = "Consent-gated, tenant-scoped voice similarity for human fraud review"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "cryptography>=50,<51",
  "numpy>=2.2,<3",
  "sherpa-onnx>=1.12,<3",
  "scipy>=1.16,<2",
]
[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]
[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
